name: Publicar

# Todo push na main (todo PR mesclado) vira uma versao nova, sem passo manual
# (DEC-APPS-DISTRIBUICAO-001, o padrao dos apps Tranal):
#   1. decide o numero da versao (ver o passo "Decidir a versao");
#   2. roda os testes;
#   3. gera o app, a CLI e o instalador com esse numero gravado;
#   4. cria a tag vX.Y.Z e a release dela (a "Latest"), com o
#      TranalUninstaller-Setup.exe como asset.
# O atualizador do app (Core/Updates/UpdateService.cs) procura a maior tag
# vX.Y.Z entre as releases: sem a tag versionada, o app instalado nunca veria
# a versao nova.
#
# O botao "Run workflow" (aba Actions) publica na hora, escolhendo o salto:
# patch (1.4.1 -> 1.4.2), minor (-> 1.5.0) ou major (-> 2.0.0).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Que parte da versao sobe'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # So a main publica: o botao rodado em outra branch soltaria uma
      # release com codigo que nao foi mesclado.
      - name: Conferir a branch
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: throw "Publicar so roda na main (esta execucao e de $env:GITHUB_REF)."

      # A versao nova parte da maior tag vX.Y.Z ja publicada e sobe a parte
      # pedida (no push, sempre o patch). A <Version> do .csproj e um PISO: se
      # ela e maior que o resultado (alguem subiu a mao), vale ela. Assim
      # nenhuma release sai com numero repetido ou menor, e o atualizador
      # sempre enxerga a nova. (A mesma logica do tranal-sentinel.)
      - name: Decidir a versao
        id: versao
        shell: pwsh
        env:
          TIPO: ${{ inputs.tipo || 'patch' }}
        run: |
          $texto = (Select-String -Path src\Tranal.Uninstaller\Tranal.Uninstaller.csproj `
            -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $piso = [version]$texto

          function Normalizar([version]$v) {
            [version]::new($v.Major, $v.Minor, [Math]::Max($v.Build, 0))
          }

          $tags = git ls-remote --tags origin |
            ForEach-Object { ($_ -split 'refs/tags/')[1] } |
            Where-Object { $_ -match '^v\d+\.\d+(\.\d+)?$' } |
            ForEach-Object { Normalizar ([version]$_.Substring(1)) }
          $maior = $tags | Sort-Object -Descending | Select-Object -First 1
          if (-not $maior) { $maior = [version]::new(0, 0, 0) }

          $candidata = switch ($env:TIPO) {
            'major' { [version]::new($maior.Major + 1, 0, 0) }
            'minor' { [version]::new($maior.Major, $maior.Minor + 1, 0) }
            default { [version]::new($maior.Major, $maior.Minor, $maior.Build + 1) }
          }

          $piso = Normalizar $piso
          $nova = if ($piso -gt $candidata) { $piso } else { $candidata }

          "Tipo: $env:TIPO | maior tag: $maior | piso (.csproj): $piso | versao nova: $nova"
          "numero=$nova" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build Tranal.Uninstaller.slnx -c Release -nologo

      # A tabela de paridade com o Revo Pro so vale se a evidencia citada
      # continuar no codigo. O verificador falha o build quando uma linha
      # aponta para arquivo ou simbolo que nao existe mais.
      - name: Verificar a paridade (evidencia no codigo)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\auditoria\verificar-paridade.ps1

      - name: Testes
        run: dotnet test Tranal.Uninstaller.slnx -c Release -nologo

      - name: Publicar a GUI (arquivo unico, com o .NET embutido, exige administrador)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\publish-tranal.ps1 -Variant gui `
            -Version "${{ steps.versao.outputs.numero }}"

      - name: Publicar a variante de pre-visualizacao (sem administrador)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\publish-tranal.ps1 -Variant preview `
            -Version "${{ steps.versao.outputs.numero }}"

      # O primeiro arranque (sem o arquivo de preferencias) sobuga em dois
      # defeitos de ordenacao que nao aparecem no caminho normal. O teste
      # sobe o aplicativo de verdade: no runner nao ha area de trabalho
      # interativa como na maquina de desenvolvimento, entao a falha NAO
      # bloqueia a release — mas ela fica visivel no resultado do passo, e
      # as mesmas regras sao cobertas por teste de unidade (ColdStartTests).
      - name: Partida a frio (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-cold-start.ps1 `
            -Exe publish\preview\TranalUninstaller.exe

      # O painel ancoravel (o "push pin" do Uninstall Tool): o botao que
      # fixa abre o painel na lateral e o botao que fecha solta. A suite de
      # testes cobre o nucleo; este passo cobre a ligacao com a interface,
      # que a suite nao alcanca (ela nao referencia o projeto WPF).
      - name: Painel ancoravel (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-painel-ancorado.ps1 `
            -Exe publish\preview\TranalUninstaller.exe

      # A Central (o "Action Center" do IObit): o botao da barra lateral abre a
      # tela, a tela carrega e a linha de status chega ao resumo. A suite de
      # testes cobre o nucleo (CentralOverview); este passo cobre a ligacao
      # com a interface, que a suite nao alcanca (ela nao referencia o
      # projeto WPF).
      - name: Central (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-central.ps1 `
            -Exe publish\preview\TranalUninstaller.exe

      # A impressao: o item "Imprimir lista..." do menu principal abre a
      # janela de impressao, e a janela de rastreio abre pelo mesmo menu.
      # A suite de testes cobre o nucleo (PrintTable e ChangeTreeReport);
      # estes passos cobrem a ligacao com a interface.
      - name: Impressao (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-impressao.ps1 `
            -Exe publish\preview\TranalUninstaller.exe

      - name: Publicar a CLI (arquivo unico, com o .NET embutido)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\publish-tranal.ps1 -Variant cli `
            -Version "${{ steps.versao.outputs.numero }}"

      # O gerenciador de menu de contexto (o "Context Menu Manager" do HiBit):
      # o botao da barra lateral abre a tela, a tela carrega e mostra as
      # entradas medidas, e a linha de comando lista as mesmas entradas.
      #
      # O teste cria uma entrada de menu de contexto so para ele (com uma DLL
      # que nao existe, para nao mudar o botao direito da maquina) e apaga
      # tudo no final; as entradas do Tranal sao restauradas e desativadas,
      # voltando ao estado anterior.
      #
      # A suite de testes cobre o nucleo (ContextMenuOverview e
      # ContextMenuManager); este passo cobre a ligacao com a interface e com
      # a linha de comando, que a suite nao alcanca (ela nao referencia o
      # projeto WPF).
      - name: Gerenciador de menu de contexto (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-contextmenu.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe
      # O StartUp Tuner e o Crash Analyzer (ASHAMPOO T4#47 e T4#51): a tela do
      # gerenciador de autorun tem "Adicionar" e "Editar", a do crash analyzer
      # tem "Exportar relatorio" e "Pesquisar na web", e a linha de comando faz
      # o ciclo inteiro do item de inicializacao (criar, editar, desativar,
      # ativar e remover) — medido no registro.
      #
      # O teste cria um item de inicializacao so para ele (na chave Run do
      # usuario) e apaga tudo no final, mesmo se o teste falhar.
      - name: StartUp Tuner e Crash Analyzer (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-lote21.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe

      # As acoes do programa na lista (lote 22): o menu de contexto com a
      # Microsoft Store e as pastas do programa e do desinstalador, a
      # categoria vazia na tela de Categorias, o modo rapido (que abre e e
      # cancelado, sem remover nada) e os comandos novos da linha de comando.
      #
      # O teste cria uma categoria vazia so para ele (no program-data.json) e
      # apaga tudo no final, mesmo se o teste falhar.
      - name: Acoes do programa e modo rapido (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-lote22.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe

      # As sobras em arvore (lote 23): a tela de desinstalacao forcada
      # mostra a arvore com a categoria e a contagem, a busca filtra a
      # arvore e o comando "Explorar" existe.
      #
      # O teste cria uma pasta temporaria e apaga tudo no final.
      - name: Sobras em arvore (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-lote23.ps1 `
            -Exe publish\preview\TranalUninstaller.exe

      # A nota das sobras em cinco niveis (lote 24): a folha da arvore
      # mostra a nota (Muito bom, Bom, Duvidoso, Mau, Desconhecido) e a
      # linha de comando mostra a mesma nota.
      #
      # A varredura da linha de comando e SEM /remove: e apenas relatorio.
      - name: Nota das sobras em cinco niveis (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-lote24.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe
      # A remocao das entradas da lista do Windows, em lote (lote 26): a
      # entrada de teste sai do registro e a linha de comando avisa que o
      # programa NAO e desinstalado.
      #
      # O teste cria uma entrada de desinstalacao no HKCU de quem roda e
      # apaga tudo no final: nenhum software instalado e tocado.
      - name: Remocao de entradas em lote (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-lote26.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe

      # A arvore de alteracoes detectadas e a busca dentro dela (lote 27):
      # a arvore sai em hierarquia na tela e na linha de comando, e a busca
      # filtra as duas.
      #
      # O teste cria dois snapshots sinteticos (no formato que o proprio
      # Tranal grava) e apaga tudo no final: nenhum software instalado e
      # tocado.
      - name: Arvore de alteracoes e busca (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-lote27.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe


      # As marcas do programa na lista (lote 28): a lista diz o que o
      # programa e - 32 bits, atualizacao, orfao, invalido e protegido.
      # O teste so LE a lista: nenhum software e instalado ou removido.
      - name: As marcas do programa na lista (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-lote28.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe


      # O que ja existia e nao tinha dono (lote 29): a varredura de atalhos,
      # a remocao de KB do Windows, o pacote portatil e o Centro de mudancas.
      # O teste so LE e GRAVA um pacote sintetico: nada e instalado ou removido.
      - name: O que ja existia e nao tinha dono (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-lote29.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe


      # A assinatura do desinstalador e o comando do usuario: a tela mostra
      # o estado da assinatura e a linha de comando responde por
      # /signature e /signatures. O teste so LE a assinatura de arquivos do
      # proprio Windows: nada e instalado ou removido.
      - name: A assinatura do desinstalador e o comando do usuario (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-lote30.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe

      # O gerenciador do log de rastreio: a tela exclui e acrescenta itens
      # do log de instalacao, e a linha de comando responde por /log-add e
      # /log-drop. O teste cria UM log sintetico e o apaga no fim.
      - name: O gerenciador do log de rastreio (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-lote31.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe

      # A comparacao de snapshots pela linha de comando: a arvore de
      # alteracoes sai em texto, em CSV, em HTML e no layout de impressao.
      # O teste cria snapshots sinteticos e apaga tudo no final.
      - name: Comparacao de snapshots (linha de comando)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-comparacao.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -Cli publish\cli\tranal.exe

      # O instalador. O programa vai leve (1,3 MB) e o runtime do .NET
      # Desktop (60 MB) viaja dentro do setup, instalado so quando o
      # computador nao o tem: assim o setup nao depende de nada externo.
      #
      # O Inno Setup vem com a imagem do runner; se nao vier, ele e
      # instalado aqui (o runner e descartavel, nao a maquina de ninguem).
      - name: Localizar o Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup nao encontrado; instalando pelo chocolatey"
            choco install innosetup --no-progress --yes
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup nao encontrado no runner" }
          Write-Host "ISCC: $iscc"

      - name: Montar o instalador (setup)
        shell: pwsh
        env:
          # Certificado de assinatura do instalador. A chave privada e um
          # secret do repositorio: ela nunca entra no codigo.
          TRANAL_CERT_PFX: ${{ secrets.TRANAL_CERT_PFX }}
          TRANAL_CERT_PASSWORD: ${{ secrets.TRANAL_CERT_PASSWORD }}
          # Senha do instalador. Sem ela o setup e publicado sem criptografia;
          # com ela, o conteudo do instalador so abre com a senha.
          TRANAL_SETUP_PASSWORD: ${{ secrets.TRANAL_SETUP_PASSWORD }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\publish-tranal.ps1 -Variant setup `
            -Version "${{ steps.versao.outputs.numero }}"

      # O numero da release tem de estar gravado no que vai para o usuario:
      # e com ele que o atualizador compara. Compara-se X.Y.Z: medido, o .exe
      # do .NET grava "1.4.99.0" e o Setup do Inno grava "1.4.99".
      - name: Conferir a versao gravada
        shell: pwsh
        run: |
          $esperada = "${{ steps.versao.outputs.numero }}"
          foreach ($exe in 'publish\gui\TranalUninstaller.exe', 'publish\setup-payload\TranalUninstaller.exe', 'publish\setup\TranalUninstaller-Setup.exe') {
            $v = [version]((Get-Item $exe).VersionInfo.FileVersion.Trim())
            $gravada = "$($v.Major).$($v.Minor).$($v.Build)"
            if ($gravada -ne $esperada) { throw "$exe saiu com a versao $gravada, e a release e $esperada." }
            "$exe $gravada"
          }

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt publish\gui\LEIA-ME.txt
          Compress-Archive -Path publish\gui\TranalUninstaller.exe, publish\gui\LEIA-ME.txt `
            -DestinationPath TranalUninstaller.zip
          Compress-Archive -Path publish\cli\tranal.exe -DestinationPath tranal-cli.zip

      # A release da versao e a "Latest" do GitHub: e a que aparece para
      # baixar na pagina do repositorio e a que o atualizador escolhe (maior
      # tag vX.Y.Z). A tag e criada pelo proprio gh, no commit deste push (a
      # tag criada com o GITHUB_TOKEN nao dispara outra execucao).
      - name: Release da versao
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.versao.outputs.numero }}"
          gh release create $tag publish\setup\TranalUninstaller-Setup.exe `
            TranalUninstaller.zip tranal-cli.zip `
            publish\gui\TranalUninstaller.exe publish\cli\tranal.exe `
            --target $env:GITHUB_SHA --latest --title "Tranal Uninstaller Pro $tag" --notes-file NOVIDADES.md

      # A release rolante "latest" continua existindo para quem guardou o link
      # dela (e para o feed antigo, feed/tranal.json, que aponta para ela);
      # ela so nao e mais a marcada como "Latest" no GitHub.
      - name: Atualizar release "latest"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest TranalUninstaller.zip tranal-cli.zip `
            publish\gui\TranalUninstaller.exe publish\cli\tranal.exe `
            publish\setup\TranalUninstaller-Setup.exe `
            --target $env:GITHUB_SHA --latest=false `
            --title "Tranal Uninstaller Pro (versao mais recente)" --notes-file NOVIDADES.md

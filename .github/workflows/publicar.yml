name: Publicar

# A cada push na main, gera o TranalUninstaller.exe e atualiza a release "latest".
# Ao criar uma tag (ex.: v1.0), gera tambem uma release fixa dessa versao.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Tranal.Uninstaller.slnx -c Release -nologo

      # A tabela de paridade com o Revo Pro so vale se a evidencia citada
      # continuar no codigo. O verificador falha o build quando uma linha
      # aponta para arquivo ou simbolo que nao existe mais.
      - name: Verificar a paridade (evidencia no codigo)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\auditoria\verificar-paridade.ps1

      - name: Testes
        run: dotnet test Tranal.Uninstaller.slnx -c Release -nologo

      - name: Publicar a GUI (arquivo unico, com o .NET embutido, exige administrador)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\publish-tranal.ps1 -Variant gui

      - name: Publicar a variante de pre-visualizacao (sem administrador)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\publish-tranal.ps1 -Variant preview

      # O primeiro arranque (sem o arquivo de preferencias) sobuga em dois
      # defeitos de ordenacao que nao aparecem no caminho normal. O teste
      # sobe o aplicativo de verdade: no runner nao ha area de trabalho
      # interativa como na maquina de desenvolvimento, entao a falha NAO
      # bloqueia a release — mas ela fica visivel no resultado do passo, e
      # as mesmas regras sao cobertas por teste de unidade (ColdStartTests).
      - name: Partida a frio (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-cold-start.ps1 `
            -Exe publish\preview\TranalUninstaller.exe

      # O painel ancoravel (o "push pin" do Uninstall Tool): o botao que
      # fixa abre o painel na lateral e o botao que fecha solta. A suite de
      # testes cobre o nucleo; este passo cobre a ligacao com a interface,
      # que a suite nao alcanca (ela nao referencia o projeto WPF).
      - name: Painel ancoravel (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-painel-ancorado.ps1 `
            -Exe publish\preview\TranalUninstaller.exe

      # A Central (o "Action Center" do IObit): o botao da barra lateral abre a
      # tela, a tela carrega e a linha de status chega ao resumo. A suite de
      # testes cobre o nucleo (CentralOverview); este passo cobre a ligacao
      # com a interface, que a suite nao alcanca (ela nao referencia o
      # projeto WPF).
      - name: Central (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-central.ps1 `
            -Exe publish\preview\TranalUninstaller.exe

      # A impressao: o item "Imprimir lista..." do menu principal abre a
      # janela de impressao, e a janela de rastreio abre pelo mesmo menu.
      # A suite de testes cobre o nucleo (PrintTable e ChangeTreeReport);
      # estes passos cobrem a ligacao com a interface.
      - name: Impressao (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-impressao.ps1 `
            -Exe publish\preview\TranalUninstaller.exe

      - name: Publicar a CLI (arquivo unico, com o .NET embutido)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\publish-tranal.ps1 -Variant cli

      # O gerenciador de menu de contexto (o "Context Menu Manager" do HiBit):
      # o botao da barra lateral abre a tela, a tela carrega e mostra as
      # entradas medidas, e a linha de comando lista as mesmas entradas.
      #
      # O teste cria uma entrada de menu de contexto so para ele (com uma DLL
      # que nao existe, para nao mudar o botao direito da maquina) e apaga
      # tudo no final; as entradas do Tranal sao restauradas e desativadas,
      # voltando ao estado anterior.
      #
      # A suite de testes cobre o nucleo (ContextMenuOverview e
      # ContextMenuManager); este passo cobre a ligacao com a interface e com
      # a linha de comando, que a suite nao alcanca (ela nao referencia o
      # projeto WPF).
      - name: Gerenciador de menu de contexto (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-contextmenu.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe
      # O StartUp Tuner e o Crash Analyzer (ASHAMPOO T4#47 e T4#51): a tela do
      # gerenciador de autorun tem "Adicionar" e "Editar", a do crash analyzer
      # tem "Exportar relatorio" e "Pesquisar na web", e a linha de comando faz
      # o ciclo inteiro do item de inicializacao (criar, editar, desativar,
      # ativar e remover) — medido no registro.
      #
      # O teste cria um item de inicializacao so para ele (na chave Run do
      # usuario) e apaga tudo no final, mesmo se o teste falhar.
      - name: StartUp Tuner e Crash Analyzer (aplicativo de verdade)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-lote21.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -CliExe publish\cli\tranal.exe

      # A comparacao de snapshots pela linha de comando: a arvore de
      # alteracoes sai em texto, em CSV, em HTML e no layout de impressao.
      # O teste cria snapshots sinteticos e apaga tudo no final.
      - name: Comparacao de snapshots (linha de comando)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-comparacao.ps1 `
            -Exe publish\preview\TranalUninstaller.exe `
            -Cli publish\cli\tranal.exe

      # O instalador. O programa vai leve (1,3 MB) e o runtime do .NET
      # Desktop (60 MB) viaja dentro do setup, instalado so quando o
      # computador nao o tem: assim o setup nao depende de nada externo.
      #
      # O Inno Setup vem com a imagem do runner; se nao vier, ele e
      # instalado aqui (o runner e descartavel, nao a maquina de ninguem).
      - name: Localizar o Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup nao encontrado; instalando pelo chocolatey"
            choco install innosetup --no-progress --yes
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup nao encontrado no runner" }
          Write-Host "ISCC: $iscc"

      - name: Montar o instalador (setup)
        shell: pwsh
        env:
          # Certificado de assinatura do instalador. A chave privada e um
          # secret do repositorio: ela nunca entra no codigo.
          TRANAL_CERT_PFX: ${{ secrets.TRANAL_CERT_PFX }}
          TRANAL_CERT_PASSWORD: ${{ secrets.TRANAL_CERT_PASSWORD }}
          # Senha do instalador. Sem ela o setup e publicado sem criptografia;
          # com ela, o conteudo do instalador so abre com a senha.
          TRANAL_SETUP_PASSWORD: ${{ secrets.TRANAL_SETUP_PASSWORD }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\publish-tranal.ps1 -Variant setup

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt publish\gui\LEIA-ME.txt
          Compress-Archive -Path publish\gui\TranalUninstaller.exe, publish\gui\LEIA-ME.txt `
            -DestinationPath TranalUninstaller.zip
          Compress-Archive -Path publish\cli\tranal.exe -DestinationPath tranal-cli.zip

      - name: Atualizar release "latest"
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          gh release delete latest --cleanup-tag --yes
          gh release create latest TranalUninstaller.zip tranal-cli.zip `
            publish\gui\TranalUninstaller.exe publish\cli\tranal.exe `
            publish\setup\TranalUninstaller-Setup.exe `
            --target $env:GITHUB_SHA --latest `
            --title "Tranal Uninstaller Pro (versao mais recente)" --notes-file NOVIDADES.md

      # O feed de atualizacao do proprio Tranal.
      #
      # A release "latest" e uma tag MOVEL: o nome dela e "latest", sem
      # numero de versao. Uma tag sem numero nao diz qual versao foi
      # publicada, e por isso a versao mora em um arquivo do repositorio,
      # reescrito aqui com o que a publicacao acabou de montar.
      #
      # O arquivo so e gravado quando o conteudo muda de verdade: o
      # endereco do instalador e fixo (a tag movel) e a versao so muda
      # quando o projeto muda de versao. Sem isso, cada push faria um
      # commit e o proprio commit dispararia outro push.
      - name: Atualizar o feed de atualizacao
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        run: |
          $versao = (Select-String -Path src\Tranal.Uninstaller\Tranal.Uninstaller.csproj `
            -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $conteudo = @"
          {
            "latestVersion": "$versao",
            "downloadUrl": "https://github.com/Matheus-araujo-dev/tranal-uninstaller/releases/download/latest/TranalUninstaller-Setup.exe",
            "releaseNotes": "https://github.com/Matheus-araujo-dev/tranal-uninstaller/releases/tag/latest"
          }
          "@
          $arquivo = "feed/tranal.json"
          $atual = if (Test-Path $arquivo) { (Get-Content $arquivo -Raw) } else { "" }
          if ($atual.Trim() -ne $conteudo.Trim()) {
            [System.IO.File]::WriteAllText((Join-Path (Get-Location) $arquivo), $conteudo + "`n", (New-Object System.Text.UTF8Encoding($false)))
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $arquivo
            git commit -m "Atualiza o feed de atualizacao (versao $versao)"
            git push
          }

      - name: Release da versao (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME TranalUninstaller.zip tranal-cli.zip `
            publish\gui\TranalUninstaller.exe publish\cli\tranal.exe `
            publish\setup\TranalUninstaller-Setup.exe `
            --title "Tranal Uninstaller Pro $env:GITHUB_REF_NAME" --generate-notes --latest=false
